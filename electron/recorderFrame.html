<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif; user-select: none; cursor: default; }
  #frame { position: fixed; inset: 0; display: flex; flex-direction: column; }
  /* The border outlines ONLY the recorded area. 2px MUST match RECORDER_BORDER.
     A 1px dark outer ring keeps it visible on any background. */
  #capture { flex: 1; box-sizing: border-box; background: transparent;
    border: 2px solid #3b82f6; box-shadow: 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.35); }
  #capture.recording { border-color: #ef4444; }
  /* 44px toolbar MUST match RECORDER_TOOLBAR. */
  #toolbar { flex: 0 0 44px; height: 44px; box-sizing: border-box;
    background: #212124; border-top: 1px solid rgba(0,0,0,0.6); color: #d6d6d9; font-size: 12px;
    display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; }
  /* Circular record control: red dot -> red square when recording -> spinner while saving. */
  #recBtn { width: 30px; height: 30px; min-width: 30px; padding: 0; border-radius: 50%;
    background: rgba(255,255,255,0.09); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 120ms ease; }
  #recBtn:hover { background: rgba(255,255,255,0.16); }
  #recBtn:disabled { cursor: default; }
  #recShape { width: 15px; height: 15px; border-radius: 50%; background: #ef4444; transition: width .16s ease, height .16s ease, border-radius .16s ease; }
  #recBtn:hover #recShape { background: #f4605f; }
  #recBtn.recording #recShape { width: 12px; height: 12px; border-radius: 3px; }
  #recBtn.saving #recShape { display: none; }
  #recSpinner { display: none; width: 15px; height: 15px; box-sizing: border-box;
    border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite; }
  #recBtn.saving #recSpinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ghost icon/text buttons */
  #audioBtn, #sizeBtn, #closeBtn { background: none; border: none; color: #c6c6ca; cursor: pointer;
    border-radius: 6px; display: inline-flex; align-items: center; }
  #audioBtn:hover, #sizeBtn:hover, #closeBtn:hover { background: rgba(255,255,255,0.09); color: #fff; }
  #audioBtn { padding: 5px; line-height: 0; }
  #audioBtn.muted { color: #77777b; }
  #audioBtn:disabled { cursor: default; }
  #audioBtn svg { display: block; }
  #sizeBtn { gap: 5px; font-size: 12px; padding: 5px 10px; }
  #sizeBtn .caret { opacity: 0.5; font-size: 8px; }
  #sizeBtn.hidden { display: none; }
  #sep { width: 1px; height: 18px; background: rgba(255,255,255,0.11); margin: 0 3px; }
  #sizePanel { position: fixed; left: 10px; bottom: 50px; z-index: 10; background: #1c1c1e; border: 1px solid #000;
    border-radius: 7px; padding: 4px; box-shadow: 0 6px 22px rgba(0,0,0,0.55); display: none; flex-direction: column;
    max-height: calc(100vh - 56px); overflow-y: auto; min-width: 158px; }
  #sizePanel.open { display: flex; }
  #sizePanel .hdr { color: #7c7c80; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 5px 8px 3px; }
  #sizePanel button { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; background: none;
    border: none; color: #eee; cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 4px; text-align: left; width: 100%; }
  #sizePanel button:hover { background: #3b82f6; color: #fff; }
  #sizePanel button small { opacity: 0.5; font-size: 11px; font-variant-numeric: tabular-nums; }
  #sizePanel button:hover small { opacity: 0.85; }
  #hint { color: #fbbf24; font-size: 11px; opacity: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint.warn { opacity: 0.95; }
  .spacer { flex: 1; }
  #meta { display: flex; align-items: center; gap: 6px; color: #86868b; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
  #meta .d { opacity: 0.4; }
  #closeBtn { font-size: 14px; padding: 5px 8px; margin-left: 2px; }
</style>
</head>
<body>
  <div id="frame">
    <div id="capture"></div>
    <div id="toolbar">
      <button id="recBtn" title="Record"><span id="recShape"></span><span id="recSpinner"></span></button>
      <span id="sep"></span>
      <button id="audioBtn" title="Audio"></button>
      <button id="sizeBtn" title="Preset sizes">Size<span class="caret">&#9662;</span></button>
      <span id="hint"></span>
      <span class="spacer"></span>
      <span id="meta"><span id="size">—</span><span class="d">·</span><span id="fps"></span></span>
      <button id="closeBtn" title="Close">&#10005;</button>
    </div>
    <div id="sizePanel"></div>
  </div>
  <script>
    const api = window.recorderFrame || {};
    const capEl = document.getElementById('capture');
    const recBtn = document.getElementById('recBtn');
    // Reflect record state through the button's shape (CSS) + tooltip, and a
    // saving state (spinner). Small helper so every entry point stays in sync.
    function setRecState(state) {
      recBtn.classList.toggle('recording', state === 'recording');
      recBtn.classList.toggle('saving', state === 'saving');
      recBtn.disabled = state === 'saving';
      recBtn.title = state === 'recording' ? 'Stop recording' : state === 'saving' ? 'Saving…' : 'Record';
    }
    const sizeEl = document.getElementById('size');
    const hintEl = document.getElementById('hint');
    const audioBtn = document.getElementById('audioBtn');
    const sizeBtn = document.getElementById('sizeBtn');
    const sizePanel = document.getElementById('sizePanel');
    const fpsEl = document.getElementById('fps');
    fpsEl.textContent = (api.fps || 30) + ' fps';

    // Crisp monochrome speaker glyphs (no colour emoji).
    const SPK_ON  = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16.4 8.6a5 5 0 010 6.8"/></svg>';
    const SPK_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';

    // Audio toggle — only shown when an audio mode is configured. Default on.
    let audioOn = api.audio && api.audio !== 'off';
    if (!audioOn && api.audio === 'off') {
      audioBtn.style.display = 'none';
    } else {
      const label = api.audio === 'mic' ? 'Microphone' : 'System audio';
      audioBtn.innerHTML = SPK_ON;
      audioBtn.title = label + ': on. Click to mute';
      audioBtn.addEventListener('click', () => {
        if (recording) return;
        audioOn = !audioOn;
        audioBtn.innerHTML = audioOn ? SPK_ON : SPK_OFF;
        audioBtn.classList.toggle('muted', !audioOn);
        audioBtn.title = label + (audioOn ? ': on. Click to mute' : ': muted. Click to enable');
      });
    }

    // ── Preset sizes ──────────────────────────────────────────────────────
    // One-click standard recording resolutions, so a user doesn't have to
    // hand-resize. Presets are OUTPUT pixels; the on-screen box is derived by
    // dividing out the display scale (devicePixelRatio) so the RECORDING lands
    // at the requested resolution regardless of Windows display scaling.
    const PRESETS = [
      { g: 'Landscape (16:9)', items: [
        { label: '480p',  w: 854,  h: 480 },
        { label: '720p',  w: 1280, h: 720 },
        { label: '1080p', w: 1920, h: 1080 },
        { label: '1440p', w: 2560, h: 1440 },
        { label: '4K',    w: 3840, h: 2160 },
      ]},
      { g: 'Other', items: [
        { label: 'Square',   w: 1080, h: 1080 },
        { label: 'Vertical', w: 1080, h: 1920 },
      ]},
    ];

    function applyPreset(outW, outH) {
      const dpr = window.devicePixelRatio || 1;
      let winW = Math.round(outW / dpr) + BORDER * 2;
      let winH = Math.round(outH / dpr) + TOOLBAR + BORDER * 2;
      // Can't capture more pixels than the screen has — clamp to the work area.
      const availW = window.screen.availWidth || window.innerWidth;
      const availH = window.screen.availHeight || window.innerHeight;
      const availX = window.screen.availLeft || 0, availY = window.screen.availTop || 0;
      winW = Math.max(MIN_W + BORDER * 2, Math.min(winW, availW));
      winH = Math.max(MIN_H + TOOLBAR + BORDER * 2, Math.min(winH, availH));
      // Keep the current top-left, nudged fully on-screen.
      let x = Math.max(availX, Math.min(window.screenX, availX + availW - winW));
      let y = Math.max(availY, Math.min(window.screenY, availY + availH - winH));
      api.setBounds({ x: Math.round(x), y: Math.round(y), width: Math.round(winW), height: Math.round(winH) });
      sizePanel.classList.remove('open');
    }

    for (const group of PRESETS) {
      const hdr = document.createElement('div'); hdr.className = 'hdr'; hdr.textContent = group.g;
      sizePanel.appendChild(hdr);
      for (const p of group.items) {
        const b = document.createElement('button');
        b.innerHTML = '<span>' + p.label + '</span><small>' + p.w + ' × ' + p.h + '</small>';
        b.addEventListener('click', () => applyPreset(p.w, p.h));
        sizePanel.appendChild(b);
      }
    }

    sizeBtn.addEventListener('click', (e) => { e.stopPropagation(); sizePanel.classList.toggle('open'); });
    document.addEventListener('mousedown', (e) => {
      if (sizePanel.classList.contains('open') && !sizePanel.contains(e.target) && !sizeBtn.contains(e.target)) {
        sizePanel.classList.remove('open');
      }
    }, true);

    // ── Audio capture (in-renderer; works for ANY output incl. Bluetooth) ──
    // 'system' → getDisplayMedia with main returning audio:'loopback'; we keep
    // only the audio track. 'mic' → getUserMedia. The encoded webm is sent to
    // main on stop and muxed with the gdigrab video.
    let audioStream = null, mediaRecorder = null, audioChunks = [];
    // Wall-clock instant the audio actually began recording (MediaRecorder.onstart).
    // Sent to main so the mux can align the two independently-started streams
    // (audio here vs. gdigrab video) instead of naively pinning both to t=0.
    let audioStartedAt = 0;
    async function startAudioCapture() {
      if (!audioOn || !api.audio || api.audio === 'off') return false;
      try {
        let stream;
        // Chromium applies echo-cancellation / noise-suppression / auto-gain by
        // default — tuned for a mic, they wreck music/video system audio
        // (warbly, pumping, muffled). Disable them for loopback capture.
        const rawAudio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
        if (api.audio === 'mic') {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } else {
          const ds = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: rawAudio });
          ds.getVideoTracks().forEach((t) => t.stop()); // we only want the loopback audio
          stream = new MediaStream(ds.getAudioTracks());
          // Belt-and-braces: force the constraints on the track too (some paths
          // ignore them in the getDisplayMedia call).
          for (const t of stream.getAudioTracks()) { try { await t.applyConstraints(rawAudio); } catch { /* ignore */ } }
        }
        if (!stream || stream.getAudioTracks().length === 0) return false;
        audioStream = stream;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm', audioBitsPerSecond: 192000 });
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) audioChunks.push(e.data); };
        // Stamp the true audio start so main can compute the A/V start offset.
        audioStartedAt = 0;
        mediaRecorder.onstart = () => { audioStartedAt = Date.now(); };
        mediaRecorder.start();
        return true;
      } catch (err) {
        audioStream = null; mediaRecorder = null;
        return false;
      }
    }
    async function stopAudioCapture(send = true) {
      if (!mediaRecorder) return;
      await new Promise((resolve) => { mediaRecorder.onstop = resolve; try { mediaRecorder.stop(); } catch { resolve(); } });
      try { audioStream && audioStream.getTracks().forEach((t) => t.stop()); } catch { /* ignore */ }
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = []; mediaRecorder = null; audioStream = null;
      // send=false on aborts (failed video start / error) so we don't write an
      // orphan audio temp with no video to mux it into.
      if (send && blob.size > 0 && api.sendAudio) {
        try { await api.sendAudio(await blob.arrayBuffer(), audioStartedAt); } catch { /* video-only */ }
      }
    }
    const BORDER = 2, TOOLBAR = 44, EDGE = 12, CORNER = 20, MIN_W = 200, MIN_H = 160; // BORDER/TOOLBAR match main.cjs
    const CURSORS = { move: 'move', nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize' };
    let recording = false, dragging = false, ignoring = false;

    function updateSize() {
      // Show the OUTPUT resolution (the recorded pixels) = framed area × display
      // scale, forced even to match the encoder. This is what actually lands in
      // the file, and it lines up with the preset labels.
      const dpr = window.devicePixelRatio || 1;
      let w = Math.max(0, Math.round((window.innerWidth - BORDER * 2) * dpr));
      let h = Math.max(0, Math.round((window.innerHeight - TOOLBAR - BORDER * 2) * dpr));
      w -= w % 2; h -= h % 2;
      sizeEl.textContent = w + ' × ' + h;
      sizeEl.title = 'Recording resolution (pixels)';
    }
    window.addEventListener('resize', updateSize);
    updateSize();

    function setIgnore(v) { if (v !== ignoring) { ignoring = v; api.setIgnoreMouse(v); } }

    // Interactive zone at (x, y). Corners are the WHOLE window's corners
    // (top corners of the capture area, bottom corners in the toolbar).
    function regionAt(x, y) {
      const W = window.innerWidth, H = window.innerHeight, tb = H - TOOLBAR;
      const L = x < CORNER, R = x > W - CORNER, T = y < CORNER, B = y > H - CORNER;
      if (T && L) return 'nw'; if (T && R) return 'ne';
      if (B && L) return 'sw'; if (B && R) return 'se';
      if (y >= tb) return 'toolbar';               // move handle (+ buttons)
      if (x < EDGE || x > W - EDGE || y < EDGE || y > tb - EDGE) return 'move';
      return 'center';                             // click-through
    }

    document.addEventListener('mousemove', (e) => {
      if (dragging) return;
      // Buttons + the open preset panel always win (clickable + default cursor).
      if (e.target.closest && (e.target.closest('button') || e.target.closest('#sizePanel'))) { setIgnore(false); document.body.style.cursor = 'default'; return; }
      if (recording) {
        // Only the toolbar stays interactive (Stop); the rest is click-through.
        setIgnore(e.clientY < window.innerHeight - TOOLBAR);
        document.body.style.cursor = 'default';
        return;
      }
      const r = regionAt(e.clientX, e.clientY);
      if (r === 'center') { setIgnore(true); document.body.style.cursor = 'default'; return; }
      setIgnore(false);
      document.body.style.cursor = CURSORS[r] || 'default';
    });

    function winBounds() {
      return { x: window.screenX, y: window.screenY,
               w: window.outerWidth || window.innerWidth, h: window.outerHeight || window.innerHeight };
    }
    function beginDrag(e, edge) {
      e.preventDefault();
      dragging = true;
      const sx = e.screenX, sy = e.screenY, b0 = winBounds();
      const onMove = (ev) => {
        const dx = ev.screenX - sx, dy = ev.screenY - sy;
        let { x, y, w, h } = b0;
        if (!edge) { x = b0.x + dx; y = b0.y + dy; }
        else {
          if (edge.includes('e')) w = Math.max(MIN_W, b0.w + dx);
          if (edge.includes('s')) h = Math.max(MIN_H, b0.h + dy);
          if (edge.includes('w')) { w = Math.max(MIN_W, b0.w - dx); x = b0.x + b0.w - w; }
          if (edge.includes('n')) { h = Math.max(MIN_H, b0.h - dy); y = b0.y + b0.h - h; }
        }
        api.setBounds({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
      };
      const onUp = () => {
        dragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || recording) return;
      if (e.target.closest && e.target.closest('button')) return; // buttons win
      const r = regionAt(e.clientX, e.clientY);
      if (r === 'center') return;
      if (r === 'nw' || r === 'ne' || r === 'sw' || r === 'se') beginDrag(e, r); // resize
      else beginDrag(e, null);                                                   // move
    });

    recBtn.addEventListener('click', async () => {
      if (!recording) {
        hintEl.textContent = ''; hintEl.classList.remove('warn'); // clear any stale audio warning
        // Kick off audio + video together. startAudioCapture() is listed first
        // so getDisplayMedia/getUserMedia is invoked within this click's user-
        // activation; running them concurrently keeps the two streams tightly
        // aligned (video no longer waits for audio setup).
        const [audioStarted, res] = await Promise.all([startAudioCapture(), api.start()]);
        if (res && res.error) {
          await stopAudioCapture(false);
          hintEl.textContent = 'Could not start: ' + (res.error.message || 'unknown error');
          hintEl.classList.add('warn');
          return;
        }
        recording = true;
        capEl.classList.add('recording');
        setRecState('recording');
        // Can't change the frame size mid-recording — hide the preset picker.
        sizePanel.classList.remove('open');
        sizeBtn.classList.add('hidden');
        if (audioOn && api.audio !== 'off' && !audioStarted) {
          hintEl.textContent = 'Audio unavailable; video only';
          hintEl.classList.add('warn');
        }
      } else {
        setRecState('saving');
        await stopAudioCapture(); // finalize + send audio before stopping video
        await api.stop();
      }
    });

    document.getElementById('closeBtn').addEventListener('click', async () => {
      if (recording) {
        // Finish the recording (don't lose it). Must send the captured audio
        // before stopping the video, same as the Stop button.
        setRecState('saving');
        await stopAudioCapture();
        api.stop();
      } else {
        api.cancel();
      }
    });

    if (api.onState) api.onState((s) => {
      if (s && s.error) {
        recording = false;
        capEl.classList.remove('recording');
        setRecState('idle');
        sizeBtn.classList.remove('hidden');
        stopAudioCapture(false);
        // Surface the reason — a silent reset made every capture failure look
        // like "clicked record, nothing happened".
        hintEl.textContent = String(s.error);
        hintEl.classList.add('warn');
      }
    });
  </script>
</body>
</html>
