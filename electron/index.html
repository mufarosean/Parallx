<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; style-src 'self' 'unsafe-inline'; script-src 'self' file: blob:; worker-src 'self' blob:; font-src 'self' data: blob:; img-src 'self' data: blob: https: parallx-asset:; media-src 'self' data: blob: https: parallx-asset:; object-src 'self' data:; frame-src 'self' data: blob: https:" />
  <title>Parallx</title>
  <link rel="icon" type="image/svg+xml" href="src/assets/parallx-logo.svg" />
  <!-- Loading overlay styles — inline so they paint on the very first frame,
       before external CSS or JS loads. Covers all assembly phases. -->
  <style>
    #parallx-loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      /* Pre-CSS boot frame: literals must MATCH the token values
         (--px-base-00 #16171a; the UI font stack) — this paints before
         any stylesheet loads, and a mismatched color here is the flash. */
      background: #16171a;
      color: #838893;
      font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }
    #parallx-loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out;
    }
  </style>
  <link rel="stylesheet" href="dist/renderer/main.css" />
</head>
<body>
  <!-- The same logo the title bar and watermark draw (src/ui/brandIcons.ts
       px-mark), in the overlay's own muted ink. It was magenta here and
       monochrome everywhere else, which read as two different loading
       screens. This copy exists only because no script has loaded yet. -->
  <div id="parallx-loading-overlay">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="4.5" y="6" width="12" height="12" rx="1.1" transform="skewX(-8)" opacity="0.4"/>
      <rect x="7.5" y="4.5" width="12" height="12" rx="1.1" transform="skewX(-8)"/>
    </svg>
    <span>Loading workspace…</span>
  </div>
  <div id="workbench"></div>
  <script src="dist/renderer/main.js"></script>
</body>
</html>
